# 上传限制配置
# 适用版本: Khala 7.x+

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 500MB
      file-size-threshold: 2KB

khala:
  upload:
    # 允许上传的文件类型
    allowed-types:
      - image/jpeg
      - image/png
      - image/gif
      - application/pdf
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    # 禁止上传的文件类型
    forbidden-types:
      - application/x-msdownload
      - application/x-executable
