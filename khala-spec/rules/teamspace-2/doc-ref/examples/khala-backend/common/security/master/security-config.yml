# 安全防护配置
# 适用版本: Khala 7.x+

khala:
  protection:
    # 请求参数加密解密
    encrypt: true
    # 校验参数签名
    check-sign: true
    # 时间戳超时时间（秒），默认一小时
    timestamp-timeout: 3600
    # 是否检测敏感词
    sensitive: true
    # 是否开启动态加密（用户级别动态密钥）
    dynamicEncrypt: true
    # 接口返回内容转义（默认开启）
    escape: true
    # SQL 注入防护
    sql: true
    # XSS 过滤
    xss: true
    # 跨域限制（false = 不限制）
    cors: false
    # Referer 校验
    referer: false
    # Host 校验
    host: false
    # 允许的 Referer 列表（生产环境需重新配置）
    allowed-referers:
      - http://localhost:8080/
      - http://localhost:8080/login
    # 允许的 Host 列表
    allowed-hosts:
      - localhost:8080
      - localhost:8800
    # 允许的 Origin
    allowed-origins:
      - http://localhost:8080
