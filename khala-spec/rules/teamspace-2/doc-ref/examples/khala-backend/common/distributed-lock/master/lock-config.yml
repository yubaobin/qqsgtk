# ========================================
# 分布式锁配置
# ========================================

# --- 方式一：@Lock 注解配置 ---
khala:
  lock:
    # 锁实现类型：redis（默认）| redisson
    type: redis

# --- 方式二：@Klock 注解配置 ---
khala:
  klock:
    # 等待锁释放的超时时间（毫秒），默认 60000
    wait-time: 60000
    # 锁持有的最长时间（毫秒），默认 60000
    lease-time: 60000
    # 锁类型：redis（默认）| ctgcache
    type: redis

# --- Redis 连接配置（锁依赖 Redis） ---
spring:
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
