# ========================================
# 验证码配置
# ========================================

khala:
  captcha:
    # --- 图形验证码配置 ---
    graph:
      # 是否启用图形验证码，默认 true
      enabled: true
      # 验证码类型：simple（简单算术/字符）
      type: simple
      # 验证码有效期（秒），默认 300
      validity: 300
      # 验证码重试次数，超过后验证码失效，默认 1
      retries: 3
      # 默认万能验证码（开发环境使用，生产环境请移除）
      default-code-verify: "0000"
      # 图片类型：gif | png
      img-type: gif
      # 需要校验验证码的登录接口路径
      login-url:
        - /oauth/token
        - /oauth/login
    # --- 短信/邮箱验证码配置 ---
    code:
      # 是否启用，默认 true
      enabled: true
      # 验证码长度，默认 6
      length: 6
      # 验证码有效时间（秒），默认 300（5分钟）
      validity: 300
      # 验证码重试次数，默认 3
      retries: 3

# --- 滑块验证码配置（基于天验组件） ---
captcha:
  expire:
    default: 10000
    # 文字点选验证码过期时间设置大一点
    WORD_IMAGE_CLICK: 60000
  # 二次校验
  secondary:
    enabled: true
  # 初始化默认模板文件
  init-default-resource: true
  local-cache-enabled: true
  local-cache-size: 20

# --- Redis 配置（验证码存储依赖 Redis） ---
spring:
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
