# 任务开关配置示例
# 适用版本: Khala 7.x+

# 场景 1：开发环境启用定时任务
---
spring:
  config:
    activate:
      on-profile: dev
khala:
  job:
    enabled: true

---
# 场景 2：测试环境启用定时任务（连接测试 Server）
spring:
  config:
    activate:
      on-profile: test
khala:
  job:
    enabled: true
powerjob:
  worker:
    server-address: 192.168.1.100:7700

---
# 场景 3：生产环境启用定时任务（连接生产 Server）
spring:
  config:
    activate:
      on-profile: prod
khala:
  job:
    enabled: true
powerjob:
  worker:
    server-address: powerjob.prod.internal:7700

---
# 场景 4：本地调试时关闭定时任务
spring:
  config:
    activate:
      on-profile: local
khala:
  job:
    enabled: false
