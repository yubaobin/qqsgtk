# ========================================
# 动态数据源配置
# ========================================

spring:
  datasource:
    dynamic:
      # 是否启用动态数据源，默认 true
      enabled: true
      # 默认数据源名称
      primary: master
      # 严格模式：未匹配到数据源时报错
      strict: false
      # 数据源策略（可选自定义）
      # strategy: com.eshore.khala.starter.dynamic.datasource.strategy.KhalaDynamicDataSourceStrategy
      datasource:
        # 主库
        master:
          url: jdbc:mysql://localhost:3306/khala_main?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver
        # 从库
        slave:
          url: jdbc:mysql://localhost:3306/khala_slave?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver
        # 报表库
        report:
          url: jdbc:mysql://localhost:3306/khala_report?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver
