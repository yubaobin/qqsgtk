# ========================================
# 幂等性/防重复提交配置
# ========================================

khala:
  idempotent:
    # 是否启用幂等组件，默认 true
    enabled: true
    # 默认幂等超时时间（毫秒），默认 1000（1秒）
    # 注解上的 time 会覆盖此配置
    time: 1000

# --- Redis 连接配置（幂等组件依赖 Redis） ---
spring:
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
