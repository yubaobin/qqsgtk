# ========================================
# 邮件发送配置
# ========================================

khala:
  email:
    # 是否启用邮件组件，默认 true
    enabled: true
    # 邮件配置来源：config（配置文件）| database（数据库），默认 config
    datasource: config
    # 当前激活的邮件渠道
    active: default
    # 渠道配置
    type:
      default:
        host: smtp.example.com
        port: 465
        mail: noreply@example.com
        username: noreply@example.com
        password: your-password
        ssl-enable: true
    # 模板配置
    template:
      captcha:
        subject: 验证码
        content: 您本次的验证码是：{code}，5分钟内有效，非本人操作请忽略。
        params:
          - code
      notify:
        subject: 系统通知
        content: 您有一条新通知：{content}
        params:
          - content
