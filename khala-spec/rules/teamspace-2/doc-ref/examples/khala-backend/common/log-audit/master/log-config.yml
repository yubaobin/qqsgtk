# ======================== Khala Logback 日志配置示例 ========================
#
# 相关源码：
# - 链路追踪：com.eshore.khala.starter.log.core.trace.MdcTraceUtils
# - 审计日志配置：com.eshore.khala.starter.log.core.properties.AuditLogProperties
#
# 使用方式：将此文件放入 src/main/resources/logback-spring.xml 并按需调整

<configuration>

    <!-- ======================== 日志路径 ======================== -->
    <property name="LOG_PATH" value="./logs"/>
    <property name="APP_NAME" value="khala-service"/>

    <!-- ======================== 控制台输出（开发环境） ======================== -->
    <!-- 关键：日志格式中 %X{traceId} 输出链路追踪ID -->
    <appender name="CONSOLE" class="ch.qos.logback.core.ConsoleAppender">
        <encoder>
            <pattern>%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{50} - %msg%n</pattern>
            <charset>UTF-8</charset>
        </encoder>
    </appender>

    <!-- ======================== 滚动文件输出 ======================== -->
    <appender name="FILE" class="ch.qos.logback.core.rolling.RollingFileAppender">
        <file>${LOG_PATH}/${APP_NAME}.log</file>
        <rollingPolicy class="ch.qos.logback.core.rolling.SizeAndTimeBasedRollingPolicy">
            <fileNamePattern>${LOG_PATH}/${APP_NAME}.%d{yyyy-MM-dd}.%i.log</fileNamePattern>
            <maxFileSize>200MB</maxFileSize>
            <maxHistory>30</maxHistory>
            <totalSizeCap>5GB</totalSizeCap>
        </rollingPolicy>
        <encoder>
            <!-- 格式说明：
                 %d           — 时间
                 %thread      — 线程名
                 %X{traceId}  — MDC 中的链路追踪ID
                 %-5level     — 日志级别
                 %logger      — Logger 名称
                 %msg         — 日志内容
            -->
            <pattern>%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{50} - %msg%n</pattern>
            <charset>UTF-8</charset>
        </encoder>
    </appender>

    <!-- ======================== 异步日志（推荐生产环境使用） ======================== -->
    <!-- 异步写入避免日志IO阻塞业务线程 -->
    <appender name="ASYNC_FILE" class="ch.qos.logback.classic.AsyncAppender">
        <!-- 队列容量 -->
        <queueSize>512</queueSize>
        <!-- 队列满时丢弃 TRACE/DEBUG 级别日志 -->
        <discardingThreshold>0</discardingThreshold>
        <!-- 不丢弃 WARN 以上级别日志 -->
        <neverBlock>false</neverBlock>
        <appender-ref ref="FILE"/>
    </appender>

    <!-- ======================== 审计日志配置 ======================== -->
    <!-- Khala 审计日志配置项，在 application.yml 中配置 -->
    <!--
    khala:
      audit-log:
        enabled: true                    # 是否开启审计日志（默认 true）
        log-type: db                     # 日志存储方式：db（数据库，默认）/ logger（日志文件）
        sensitive-key:                   # 敏感字段Key列表，记录日志时自动脱敏
          - password
          - pwd
          - token
          - secret
          - creditcard
    -->

    <!-- ======================== 日志级别 ======================== -->
    <!-- 生产环境推荐级别 -->
    <logger name="com.eshore.khala" level="INFO"/>
    <!-- 第三方框架日志级别 -->
    <logger name="org.springframework" level="WARN"/>
    <logger name="org.apache.ibatis" level="WARN"/>
    <logger name="com.baomidou.mybatisplus" level="WARN"/>

    <!-- ======================== 环境配置 ======================== -->
    <!-- 开发环境：控制台输出 -->
    <springProfile name="dev">
        <root level="INFO">
            <appender-ref ref="CONSOLE"/>
        </root>
    </springProfile>

    <!-- 测试环境：控制台 + 文件 -->
    <springProfile name="test">
        <root level="INFO">
            <appender-ref ref="CONSOLE"/>
            <appender-ref ref="FILE"/>
        </root>
    </springProfile>

    <!-- 生产环境：异步文件输出 -->
    <springProfile name="prod">
        <root level="INFO">
            <appender-ref ref="ASYNC_FILE"/>
        </root>
    </springProfile>

</configuration>
