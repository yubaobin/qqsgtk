schema: spec-driven
designSchema: sdd-design

context: |
  语言：中文（简体）
  所有产出物必须用简体中文撰写。

# design 输入路径配置（可选，相对于 khala-spec/ 目录）
# 不配置时使用默认路径。
# designContext:
#   requirements: rd/requirements/
#   prototype: prototype/
#   backendDocs: spec/docs/backend/
#   frontendDocs: spec/docs/frontend/

# 按 artifact 定制规则（可选）
# 为特定 artifact 添加自定义规则。
# rules:
#   proposal:
#     - proposal 控制在 500 字以内
#     - 必须包含"非目标"章节
#   tasks:
#     - 每个任务拆分不超过 2 小时

# 跳过由外部依赖覆盖的模块（可选）
# 当项目依赖已提供完整功能时，跳过架构文档中对应的模块。
# skipModules:
#   - module: user-auth
#     aliases: ["user", "auth", "user-authentication"]
#     reason: "khala-authorization-server 依赖已提供完整用户认证功能"
#     when:
#       pomContains: "com.eshore.khala:khala-authorization-server"
#       pomPath: "backend/pom.xml"  # 可选，默认扫描根目录及一级子目录的 pom.xml
