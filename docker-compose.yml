services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_BASE_PATH=${VITE_BASE_PATH:-/}
    container_name: ocr-app
    ports:
      - "8001:80"
    restart: unless-stopped
    mem_limit: 1.5g
    memswap_limit: 2g
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - ONNX_NUM_THREADS=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - paddle-models:/root/.paddleocr
      - ./backend/data:/app/backend/data

volumes:
  paddle-models:
