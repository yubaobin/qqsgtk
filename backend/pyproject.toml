[project]
name = "ocr-backend"
version = "0.1.0"
description = "PaddleOCR-based image text recognition API"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "paddlepaddle>=2.5.0,<3.0.0",
    "paddleocr>=2.7.0,<3.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]
